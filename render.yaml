# Render Blueprint: un servicio web (API + frontend) + PostgreSQL gestionado
databases:
  - name: bankshield-db
    plan: free
    databaseName: bankshield
    user: bankshield

services:
  - type: web
    name: bankshield-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bankshield-db, property: connectionString }
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bankshield.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: THREAT_FEED_URLS
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
