# Render Blueprint Specification
# Documentación: https://render.com/docs/blueprint-spec
# Este archivo permite desplegar BankShield AI en Render automáticamente (Infrastructure as Code).

services:
  - type: web
    name: bankshield-ai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      # Regla de reescritura SPA: redirige todas las rutas a /index.html para soporte de React
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
